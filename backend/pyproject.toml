[project]
name = "askit-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.9",
    "openai>=2.45.0",
    "opik>=2.2.6",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "email-validator>=2.0.0",
    "qdrant-client>=1.18.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "fastembed>=0.3.1",
    "ruff>=0.16.0",
    "uvicorn>=0.51.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.32",
    "boto3>=1.43.62",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind-except: intentional fault-tolerance throughout the retrieval/ingest stack
    "B008",    # function-call-in-default-argument: FastAPI File()/Form() idiom
    "B017",    # assert-raises-exception: pytest.raises(Exception) for pydantic validation
    "PLR0402", # manual-from-import: test fixtures use `import x.y as z` for importlib.reload
    "RUF059",  # unused-unpacked-variable: conventional `_` / tuple unpacking in scrolls
]
